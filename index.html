<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Công Việc - Todo List</title>
    <link rel="stylesheet" href="todo-list.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>📝 Quản Lý Công Việc</h1>
        <div class="input-group">
          <input
            type="text"
            id="taskInput"
            placeholder="Nhập công việc mới..."
            autocomplete="off"
          />
          <button id="addBtn" class="btn-add">Thêm</button>
        </div>
      </header>

      <!-- Body - Task List -->
      <main class="task-list" id="taskList">
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="task-counter">
          <span id="completedCount">0</span> /
          <span id="totalCount">0</span> công việc hoàn thành
        </div>
      </footer>
    </div>

    <script>
        let listTask = [];
        let inputTask = document.getElementById('taskInput');
        let addBtn = document.getElementById('addBtn');
        let taskList = document.getElementById('taskList');

        addBtn.addEventListener("click", createTask);
        inputTask.addEventListener("keypress", (e)=>{
            if(e.key === 'Enter'){
                createTask();
            }
        })
        function createTask(){
            let valueInput = inputTask.value.trim();

            if(valueInput === '' ){
                alert("Vui lòng nhập công việc");
                return;
            }
            let newTask = {
                id: Date.now(),
                name: valueInput,
                status: false
            };

            listTask.push(newTask);
            
            console.log(listTask);
            inputTask.value = '';
            inputTask.focus();

            renderTask();
        }

        function renderTask(){
            taskList.innerHTML = "";
            let showList = document.createElement('div');
            if(listTask.length === 0){
                taskList.innerHTML = `
                 <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          <div class="empty-state-text">
            Chưa có công việc nào. Hãy thêm công việc mới!
          </div>
        </div>`
            }

            listTask.forEach((task) => {
                showList.innerHTML += `
                <div class="task-item" data-id="${task.id}">
          <input type="checkbox" class="task-checkbox" /><span class="task-text"
            >${task.name}</span
          >
          <div class="task-actions">
            <button class="btn-edit">✏️ Sửa</button
            ><button class="btn-delete" onclick="deleteTask(${task.id})">🗑️ Xóa</button>
          </div>
        </div>`
            })
            taskList.appendChild(showList);
        }
        renderTask();

        // delete task
        function deleteTask(id){
            listTask = listTask.filter(task => task.id !== id);
            renderTask();
        }
    </script>
  </body>
</html>
